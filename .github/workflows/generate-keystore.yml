name: Generate Android Keystore (ONE TIME ONLY)

# Creates the permanent signing key and stores it in this repo's GitHub Secrets.
# Every future APK must be signed with this SAME key, otherwise Android refuses to update the installed app.
# One-time prerequisites (see docs/ANDROID_RELEASE.md):
#   secret GH_ADMIN_PAT               fine-grained token for THIS repo with "Secrets: Read and write"
#   secret KEYSTORE_BACKUP_PASSPHRASE long passphrase (12+ chars) used to encrypt the backup file
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type GENERATE to create the keystore'
        required: true
      overwrite:
        description: 'Leave EMPTY. Only type OVERWRITE if a keystore already exists AND you accept that installed apps can no longer be updated'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GH_ADMIN_PAT }}
      BACKUP_PASS: ${{ secrets.KEYSTORE_BACKUP_PASSPHRASE }}
      REPO: ${{ github.repository }}
      CONFIRM: ${{ inputs.confirm }}
      OVERWRITE: ${{ inputs.overwrite }}
    steps:
      - name: Validate
        run: |
          [ "$CONFIRM" = "GENERATE" ] || { echo "::error::Type GENERATE in the confirm box"; exit 1; }
          [ -n "$GH_TOKEN" ] || { echo "::error::Add secret GH_ADMIN_PAT first (docs/ANDROID_RELEASE.md)"; exit 1; }
          [ "${#BACKUP_PASS}" -ge 12 ] || { echo "::error::Add secret KEYSTORE_BACKUP_PASSPHRASE (12+ characters)"; exit 1; }

      - name: Refuse to replace an existing keystore
        run: |
          if gh secret list --repo "$REPO" | grep -q '^ANDROID_KEYSTORE_BASE64'; then
            if [ "$OVERWRITE" != "OVERWRITE" ]; then
              echo "::error::A keystore already exists in secrets. Not touching it, so future updates keep working."
              exit 1
            fi
            echo "::warning::Overwriting the existing keystore on request."
          fi

      - name: Generate keystore and save secrets
        run: |
          set -euo pipefail
          umask 077
          PASS="$(openssl rand -hex 16)"
          echo "::add-mask::$PASS"
          ALIAS="shopmaster"
          keytool -genkeypair -storetype PKCS12 -keystore shopmaster-release.jks -alias "$ALIAS" \
            -keyalg RSA -keysize 2048 -validity 10000 -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=ShopMaster Pro, OU=Perfect Computer, O=Perfect Computer, C=IN"
          base64 -w0 shopmaster-release.jks | gh secret set ANDROID_KEYSTORE_BASE64 --repo "$REPO"
          printf '%s' "$PASS"  | gh secret set ANDROID_KEYSTORE_PASSWORD --repo "$REPO"
          printf '%s' "$ALIAS" | gh secret set ANDROID_KEY_ALIAS --repo "$REPO"
          printf '%s' "$PASS"  | gh secret set ANDROID_KEY_PASSWORD --repo "$REPO"
          printf 'alias=%s\nstorepass=%s\nkeypass=%s\n' "$ALIAS" "$PASS" "$PASS" > credentials.txt
          tar czf - shopmaster-release.jks credentials.txt \
            | openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:BACKUP_PASS -out keystore-backup.enc
          {
            echo "### Keystore created and saved to repository secrets"
            echo "Certificate fingerprint (same on every future APK):"
            echo '```'
            keytool -list -v -keystore shopmaster-release.jks -storepass "$PASS" | grep -E "SHA256:|SHA1:"
            echo '```'
            echo "Download the encrypted backup artifact below and keep it somewhere safe (it is protected by KEYSTORE_BACKUP_PASSPHRASE)."
          } >> "$GITHUB_STEP_SUMMARY"
          rm -f shopmaster-release.jks credentials.txt

      - name: Upload encrypted backup
        uses: actions/upload-artifact@v4
        with:
          name: keystore-backup-ENCRYPTED
          path: keystore-backup.enc
          retention-days: 7
          if-no-files-found: error
