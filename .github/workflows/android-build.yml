name: ShopMaster Pro - Signed Android Release APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: shopmaster-android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install project dependencies
        run: npm install

      - name: Diagnose GitHub Variables
        env:
          TEST_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          TEST_SUPABASE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Branch: $GITHUB_REF_NAME"

          if [ -n "$TEST_SUPABASE_URL" ]; then
            echo "SUPABASE URL: AVAILABLE"
          else
            echo "SUPABASE URL: MISSING"
          fi

          if [ -n "$TEST_SUPABASE_KEY" ]; then
            echo "SUPABASE KEY: AVAILABLE"
          else
            echo "SUPABASE KEY: MISSING"
          fi

      - name: Build React + Vite with Supabase configuration
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          test -n "$VITE_SUPABASE_URL" || (echo 'Missing Actions Variable: VITE_SUPABASE_URL' && exit 1)
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY" || (echo 'Missing Actions Variable: VITE_SUPABASE_PUBLISHABLE_KEY' && exit 1)
          npm run build

      - name: Add Capacitor Android platform
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android

      - name: Generate Android launcher icons and splash screen
        run: npx capacitor-assets generate --android

      - name: Configure release version and signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: node scripts/configure-android-release.mjs

      - name: Build signed release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify APK output
        run: test -s android/app/build/outputs/apk/release/app-release.apk

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: ShopMaster-Pro-v1.0.1-signed-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 90
